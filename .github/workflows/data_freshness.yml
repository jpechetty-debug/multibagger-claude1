name: Data Freshness

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

jobs:
  nse-listing-freshness:
    name: NSE listing data freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas

      - name: Check data/nse_listing_dates.csv exists
        run: |
          python - << 'EOF'
          import sys
          from pathlib import Path
          csv = Path("Newmultibagger-main/data/nse_listing_dates.csv")
          if not csv.exists():
              print("FAIL: Newmultibagger-main/data/nse_listing_dates.csv is missing.")
              print("Fix: cd Newmultibagger-main && python scripts/fetch_nse_listing_data.py")
              sys.exit(1)
          print(f"OK: {csv} exists ({csv.stat().st_size // 1024}KB)")
          EOF

      - name: Check listing data shape
        run: |
          python - << 'EOF'
          import sys
          import pandas as pd
          csv = "Newmultibagger-main/data/nse_listing_dates.csv"
          df = pd.read_csv(csv)
          if len(df) < 1500:
              print(f"FAIL: only {len(df)} rows; file may be truncated.")
              sys.exit(1)
          required = {"Symbol", "Listing_Date", "Delisting_Date"}
          missing = required - set(df.columns)
          if missing:
              print(f"FAIL: missing columns: {missing}")
              sys.exit(1)
          active = df["Delisting_Date"].isna() | df["Delisting_Date"].eq("")
          print(f"OK: {len(df)} records, {active.sum()} active, {(~active).sum()} delisted.")
          EOF

      - name: Check git commit age of listing data
        run: |
          python - << 'EOF'
          import subprocess, sys
          from datetime import date, datetime
          path = "Newmultibagger-main/data/nse_listing_dates.csv"
          result = subprocess.run(
              ["git", "log", "-1", "--format=%ci", path],
              capture_output=True,
              text=True,
          )
          if not result.stdout.strip():
              print("FAIL: listing data has never been committed")
              sys.exit(1)
          commit_dt = datetime.strptime(result.stdout.strip()[:19], "%Y-%m-%d %H:%M:%S")
          age = (date.today() - commit_dt.date()).days
          if age > 30:
              print(f"FAIL: listing data last committed {age} days ago ({commit_dt.date()})")
              sys.exit(1)
          print(f"OK: listing data committed {age} days ago ({commit_dt.date()})")
          EOF

      - name: Validate RCOM delisting date
        run: |
          python - << 'EOF'
          import sys
          import pandas as pd
          df = pd.read_csv("Newmultibagger-main/data/nse_listing_dates.csv")
          rcom = df[df["Symbol"] == "RCOM"]
          if rcom.empty:
              print("FAIL: RCOM missing entirely")
              sys.exit(1)
          delisting = rcom.iloc[0]["Delisting_Date"]
          if not delisting or str(delisting).strip().lower() in ("", "nan", "nat"):
              print("FAIL: RCOM Delisting_Date is blank")
              sys.exit(1)
          print(f"OK: RCOM Delisting_Date = {delisting}")
          EOF
