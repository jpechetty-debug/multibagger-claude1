name: Data Freshness

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"   # Every Monday 02:00 UTC

jobs:
  nse-listing-freshness:
    name: NSE listing data freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needed for git log date check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas

      - name: Check data/nse_listing_dates.csv exists
        run: |
          python - << 'EOF'
          import sys
          from pathlib import Path
          csv = Path("data/nse_listing_dates.csv")
          if not csv.exists():
              print("FAIL: data/nse_listing_dates.csv is missing.")
              print("Fix: python scripts/fetch_nse_listing_data.py && git add data/nse_listing_dates.csv")
              sys.exit(1)
          print(f"OK: {csv} exists ({csv.stat().st_size // 1024}KB)")
          EOF

      - name: Check listing data is not stale (< 30 days old)
        run: |
          python - << 'EOF'
          import sys
          import pandas as pd
          from datetime import date, timedelta
          from pathlib import Path

          csv = Path("data/nse_listing_dates.csv")
          df = pd.read_csv(csv)

          # Check row count is reasonable
          if len(df) < 1_500:
              print(f"FAIL: only {len(df)} rows — expected 2000+. File may be truncated.")
              sys.exit(1)

          # Check required columns
          required = {"Symbol", "Listing_Date", "Delisting_Date"}
          missing = required - set(df.columns)
          if missing:
              print(f"FAIL: missing columns: {missing}")
              sys.exit(1)

          active = df["Delisting_Date"].isna() | df["Delisting_Date"].eq("")
          print(f"OK: {len(df)} records, {active.sum()} active, "
                f"{(~active).sum()} delisted.")
          EOF

      - name: Check git commit age of listing data
        run: |
          python - << 'EOF'
          import subprocess, sys
          from datetime import date, datetime, timezone

          result = subprocess.run(
              ["git", "log", "-1", "--format=%ci", "data/nse_listing_dates.csv"],
              capture_output=True, text=True
          )
          if not result.stdout.strip():
              print("FAIL: data/nse_listing_dates.csv has never been committed")
              sys.exit(1)

          raw_date = result.stdout.strip()
          # Parse git date format: "2025-05-27 10:30:00 +0530"
          commit_dt = datetime.strptime(raw_date[:19], "%Y-%m-%d %H:%M:%S")
          commit_date = commit_dt.date()
          age = (date.today() - commit_date).days
          if age > 30:
              print(f"FAIL: listing data last committed {age} days ago ({commit_date})")
              sys.exit(1)
          print(f"OK: listing data committed {age} days ago ({commit_date})")
          EOF

      - name: Validate a known delisted stock is present (RCOM)
        run: |
          python - << 'EOF'
          import sys
          import pandas as pd
          df = pd.read_csv("data/nse_listing_dates.csv")
          rcom = df[df["Symbol"] == "RCOM"]
          if rcom.empty:
              print("WARN: RCOM not in listing data — delisted stock coverage may be incomplete")
              # Don't fail — RCOM is just a canary
          else:
              delisting = rcom.iloc[0]["Delisting_Date"]
              print(f"OK: RCOM present, Delisting_Date = {delisting}")
          EOF
