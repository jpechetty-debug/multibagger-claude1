[pytest]
# Canonical pytest configuration for this repository.
# Keep pytest behavior here rather than duplicating it in pyproject.toml.

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

asyncio_mode = auto

addopts =
    --tb=short
    --strict-markers
    --durations=25
    -p no:doctest
    -q

timeout = 60
timeout_method = thread

markers =
    live:        Tests that call external APIs or live market sources
    unit:        Pure unit tests with no I/O
    integration: Tests that hit a real DB or service boundary
    ml:          Tests that load or train optional ML models
    slow:        Tests that take > 5 seconds
    scoring:     Tests for the scoring engine specifically
    backtest:    Tests that require data/nse_listing_dates.csv and full backtest infra

filterwarnings =
    error::DeprecationWarning
    ignore::DeprecationWarning:src.main
    ignore::DeprecationWarning:pkg_resources
    ignore::DeprecationWarning:google
    ignore::DeprecationWarning:shap.*
    ignore::PendingDeprecationWarning
    ignore::UserWarning:vectorbt
    ignore::RuntimeWarning:modules.scoring

pythonpath = .
