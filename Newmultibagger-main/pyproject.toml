[build-system]
requires = ["setuptools>=72", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# Project metadata
[project]
name = "newmultibagger"
version = "3.0.0"
description = "Institutional-grade fundamental screener for Indian equities"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "Proprietary" }
dependencies = [
    "nsepython>=2.97,<3.0",
    "pnsea>=1.0.1,<2.0",
    "yfinance>=0.2.54",
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "pandas==2.2.3",
    "numpy==1.26.4",
    "scipy==1.14.1",
    "PyYAML==6.0.2",
    "openpyxl>=3.1.5,<4.0",
    "xgboost==2.1.3",
    "shap==0.46.0",
    "hmmlearn==0.3.3",
    "vectorbt==0.26.2",
    "nltk>=3.8.0",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "asyncpg>=0.29.0,<1.0",
    "alembic>=1.13.0",
    "redis==5.2.0",
    "celery[redis]==5.4.0",
    "requests==2.32.3",
    "aiohttp==3.11.10",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
    "tenacity==9.0.0",
    "slowapi==0.1.9",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "lxml>=5.1.0,<6.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "prometheus-client>=0.20.0",
    "jinja2>=3.1.2",
    "mcp",
    "fastmcp",
]

[project.scripts]
newmultibagger = "main:app"

# Tool: ruff (lint + format)
[tool.ruff]
target-version = "py311"
line-length = 100
src = [".", "modules", "brain", "backtest", "db", "worker", "research"]
exclude = [
    ".agent", "__pycache__", "extracted_hhhhhh",
    "web-ui/node_modules", ".venv", "venv",
    "sovereign_cli.py", "sovereign_analyst_reports.py", "sovereign_mcp.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "PIE", "T20", "SIM"]
ignore = [
    "E501",
    "B008",
    "T201",
    "B904",
    "E722",
    "B015",
    "E741",
    "F841",
    "SIM",
    "N8",
    "I001",
    "F401",
    "UP007",
    "B024",
]

[tool.ruff.lint.isort]
known-first-party = ["modules", "brain", "backtest", "db", "worker", "research", "config"]

# Tool: mypy
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = true
files = ["modules/scoring.py", "modules/retry_utils.py", "db/"]
