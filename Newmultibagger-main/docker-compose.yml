# Sovereign AI Trading Engine v4.0 — Sovereign Terminal Docker Compose
# Local-first execution (SQLite + DuckDB). No PostgreSQL/Redis/Celery.

version: "3.9"

services:
  # ─── FastAPI Application Server ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sovereign_app
    environment:
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
    ports:
      - "9005:9005"
    volumes:
      - modeldata:/app/runtime/models
    command: >
      python main.py

volumes:
  # Shared model artifact store — survives container restarts and image rebuilds.
  modeldata:
